<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>Login | ऊँचागाँव</title><style>
*{box-sizing:border-box;margin:0;padding:0}:root{--green:#087443;--dark:#063b27;--cream:#f7f8f3;--line:#e4e9e5;--text:#18342a}body{font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;color:var(--text);background:var(--cream);line-height:1.55}header{background:#fff;border-bottom:1px solid var(--line)}.nav{height:64px;max-width:1100px;margin:auto;padding:0 18px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:21px;font-weight:900;color:var(--green);text-decoration:none}.nav a{text-decoration:none;color:var(--text);font-weight:700;font-size:14px}main{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:30px 18px}.box{width:min(100%,440px);background:#fff;border:1px solid var(--line);padding:30px;border-radius:16px;box-shadow:0 12px 30px #153c2710}.eyebrow{color:var(--green);font-weight:850;font-size:13px}h1{font-size:32px;color:var(--dark);margin-top:4px}.sub{color:#607069;margin:7px 0 24px}label{display:block;font-weight:750;font-size:14px;margin:14px 0 6px}input{width:100%;padding:13px 14px;border:1px solid #d6e0da;border-radius:9px;font:inherit}button{width:100%;margin-top:20px;min-height:48px;border:0;border-radius:9px;background:var(--green);color:#fff;font-weight:850;font-size:15px;cursor:pointer}button:disabled{opacity:.65}.msg{margin-top:15px;padding:11px 12px;border-radius:8px;background:var(--cream);font-size:14px;display:none}.links{display:flex;justify-content:space-between;gap:12px;margin-top:18px;font-size:13px}.links a{color:var(--green)}.top{max-width:1000px;width:100%}.dash{width:min(100%,900px);background:#fff;border:1px solid var(--line);padding:28px;border-radius:16px}.status{margin-top:20px;padding:18px;background:var(--cream);border-left:4px solid var(--green)}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.item{padding:16px;border:1px solid var(--line);border-radius:10px}.item small{display:block;color:#708078;font-size:12px}.item strong{display:block;margin-top:3px;color:var(--dark)}.logout{background:#fff;color:var(--green);border:1px solid var(--green);max-width:140px;margin-top:24px}@media(max-width:600px){.box,.dash{padding:22px}.row{grid-template-columns:1fr}}
</style>
<style>
.profile-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.avatar{width:62px;height:62px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--cream)}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.section-title{display:flex;justify-content:space-between;align-items:end;margin-top:30px;margin-bottom:12px;color:var(--dark)}.section-title span{font-size:22px;font-weight:850}.section-title small{color:#708078}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{border:1px solid var(--line);padding:18px;border-radius:10px;background:#fff}.stat span{font-size:22px}.stat strong{display:block;font-size:28px;color:var(--dark);margin-top:6px}.stat small{color:#708078}.points-box{margin-top:18px;padding:18px;border:1px solid var(--line);background:var(--cream);display:flex;justify-content:space-between;align-items:center;gap:18px}.points-box h2{font-size:20px;color:var(--dark)}.points-box p{color:#607069;font-size:13px;margin-top:3px}.points{font-size:32px;font-weight:900;color:var(--green);white-space:nowrap}.months{margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.month-head,.month-row{display:grid;grid-template-columns:1fr 100px;padding:11px 14px}.month-head{background:#f1f5f1;color:var(--dark);font-size:13px}.month-row{border-top:1px solid var(--line);font-size:14px}.month-row b{text-align:right;color:var(--green)}@media(max-width:600px){.profile-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.points-box{align-items:flex-start;flex-direction:column}}
</style>
</head><body><header><div class="nav"><a class="logo" href="index.html">ऊँचागाँव <span>🌱</span></a><a href="index.html">← Home</a></div></header><main><section class="box"><div class="eyebrow">VOLUNTEER ACCOUNT</div><h1>Login</h1><p class="sub">अपने volunteer dashboard में जाने के लिए email और password से login करें.</p><form id="loginForm"><label for="email">Gmail / Email</label><input id="email" type="email" autocomplete="email" placeholder="yourname@gmail.com" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button id="btn" type="submit">Login करें</button></form><div id="msg" class="msg"></div><div class="links"><a href="volunteer.html">Volunteer registration</a><a href="index.html">Home</a></div></section></main><script>
const SUPABASE_URL="https://njbcyvpqkrpxgoaufqyk.supabase.co";const SUPABASE_KEY="sb_publishable_UGcHXVd3p47INGgLYUIs7Q_HL2Qz23y";
const f=document.getElementById('loginForm'),m=document.getElementById('msg'),b=document.getElementById('btn');
function goDashboard(){
  // Android Chrome can open local files as content:// URLs but may block sibling-file navigation.
  // Keep the normal separate dashboard on a web server; use the same-page fallback for local testing.
  if(location.protocol==='file:' || location.protocol==='content:'){
    location.hash='dashboard';
    renderLocalDashboard();
  }else{ location.href='dashboard.html'; }
}
async function renderLocalDashboard(){
  const token=localStorage.getItem('ug_access_token');
  if(!token){return;}
  document.body.innerHTML=`<header><div class="nav"><a class="logo" href="index.html">ऊँचागाँव <span>🌱</span></a><a href="index.html">← Home</a></div></header><main><section class="dash"><div class="profile-head"><div><div class="eyebrow">MY DASHBOARD</div><h1 id="welcome">Welcome, Volunteer 👋</h1><p class="sub">यह आपका personal volunteer profile और activity dashboard है.</p></div><div class="avatar">👤</div></div><div id="status" class="status">आपकी जानकारी load हो रही है…</div><div class="profile-grid"><div class="item"><small>Name</small><strong id="name">—</strong></div><div class="item"><small>Registered Email</small><strong id="userEmail">—</strong></div><div class="item"><small>Volunteer ID</small><strong id="volId">—</strong></div><div class="item"><small>Volunteer Status</small><strong id="volStatus">—</strong></div></div><div class="section-title"><span>Activity</span><small>आपकी participation</small></div><div class="stats"><div class="stat"><span>📅</span><strong id="workingDays">0</strong><small>Working Days</small></div><div class="stat"><span>🤝</span><strong id="involvement">0</strong><small>Involvement in Affairs</small></div><div class="stat"><span>⭐</span><strong id="loyalty">0</strong><small>Loyalty Score</small></div></div><div class="points-box"><div><h2>Monthly Points</h2><p>हर महीने की activities के आधार पर दिए गए points यहाँ दिखेंगे.</p></div><div class="points" id="points">0</div></div><div class="months"><div class="month-head"><strong>Month</strong><strong>Points</strong></div>${[['January','jan'],['February','feb'],['March','mar'],['April','apr'],['May','may'],['June','jun'],['July','jul'],['August','aug'],['September','sep'],['October','oct'],['November','nov'],['December','dec']].map(x=>`<div class="month-row"><span>${x[0]}</span><b id="${x[1]}">—</b></div>`).join('')}</div><button id="logout" class="logout">Logout</button></section></main>`;
  document.getElementById('logout').onclick=()=>{localStorage.removeItem('ug_access_token');localStorage.removeItem('ug_refresh_token');location.hash='';location.reload();};
  try{
    const r=await fetch(SUPABASE_URL+'/auth/v1/user',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token}});
    if(!r.ok) throw new Error('Session expired');
    const u=await r.json();
    document.getElementById('userEmail').textContent=u.email||'—';
    const headers={apikey:SUPABASE_KEY,Authorization:'Bearer '+token};
    const vr=await fetch(SUPABASE_URL+'/rest/v1/volunteers?select=id,name,auth_user_id&auth_user_id=eq.'+encodeURIComponent(u.id),{headers});
    if(vr.ok){const rows=await vr.json();if(rows[0]){document.getElementById('name').textContent=rows[0].name||'—';document.getElementById('volId').textContent='UG-'+String(rows[0].id).padStart(4,'0');document.getElementById('volStatus').textContent='Verified / Active';}else{document.getElementById('volStatus').textContent='Profile linking pending';}}
    const sr=await fetch(SUPABASE_URL+'/rest/v1/volunteer_stats?select=working_days,involvement_affairs,loyalty_score,monthly_points&auth_user_id=eq.'+encodeURIComponent(u.id),{headers});
    if(sr.ok){const rows=await sr.json();if(rows[0]){const x=rows[0],m=x.monthly_points||{};document.getElementById('workingDays').textContent=x.working_days??0;document.getElementById('involvement').textContent=x.involvement_affairs??0;document.getElementById('loyalty').textContent=x.loyalty_score??0;const ids={january:'jan',february:'feb',march:'mar',april:'apr',may:'may',june:'jun',july:'jul',august:'aug',september:'sep',october:'oct',november:'nov',december:'dec'};let total=0;Object.keys(ids).forEach(k=>{if(m[k]!==undefined){document.getElementById(ids[k]).textContent=m[k];total+=Number(m[k])||0;}});document.getElementById('points').textContent=total;}}
    document.getElementById('status').textContent='Login successful. आपका profile और activity data यहाँ दिख रहा है.';
  }catch(err){document.getElementById('status').textContent=err.message==='Session expired'?'Session expired. कृपया दोबारा login करें.':'Dashboard data load नहीं हो पाया. Supabase connection/RLS check करें.';}
}
f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;b.textContent='Login हो रहा है…';m.style.display='none';try{const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||'Login failed');localStorage.setItem('ug_access_token',d.access_token);localStorage.setItem('ug_refresh_token',d.refresh_token||'');goDashboard()}catch(err){m.textContent=err.message||'Login नहीं हो पाया।';m.style.display='block'}finally{b.disabled=false;b.textContent='Login करें'}});
if(location.hash==='#dashboard' && localStorage.getItem('ug_access_token')) renderLocalDashboard();
</script></body></html>
